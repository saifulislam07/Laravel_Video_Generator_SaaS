; Laravel Horizon — supervises the Redis queue workers.
; Preferred queue runner in production (dashboard at /horizon, admin-gated).
; Copy to /etc/supervisor/conf.d/ then: supervisorctl reread && supervisorctl update

[program:video-generator-horizon]
process_name=%(program_name)s
command=php /var/www/video-generator/artisan horizon
directory=/var/www/video-generator
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/video-generator/storage/logs/horizon.log
stopwaitsecs=3600
; `php artisan horizon:terminate` on every deploy so workers pick up new code.
