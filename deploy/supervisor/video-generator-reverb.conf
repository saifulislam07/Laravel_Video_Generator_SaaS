; Laravel Reverb WebSocket server — powers real-time render status updates.
; Put your reverse proxy (nginx) in front of it on 443 → REVERB_SERVER_PORT.
; Copy to /etc/supervisor/conf.d/ then: supervisorctl reread && supervisorctl update

[program:video-generator-reverb]
process_name=%(program_name)s
command=php /var/www/video-generator/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/video-generator
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/video-generator/storage/logs/reverb.log
stopwaitsecs=10
; Restart on deploy: `php artisan reverb:restart`
