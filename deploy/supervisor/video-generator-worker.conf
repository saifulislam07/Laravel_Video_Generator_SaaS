; Plain queue worker — use this INSTEAD of Horizon if you are not running
; Horizon (e.g. database queue, or a host without pcntl/posix).
; Copy to /etc/supervisor/conf.d/ then: supervisorctl reread && supervisorctl update

[program:video-generator-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/video-generator/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/var/www/video-generator
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/video-generator/storage/logs/worker.log
stopwaitsecs=3600
; Run `php artisan queue:restart` on every deploy.
